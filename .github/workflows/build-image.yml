name: Image build

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [upstream-push]
  workflow_dispatch:
    inputs:
      ui_ref:
        description: MacThing ref to build
        default: main

concurrency:
  group: image-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      BUNDLE_VOICE: "0"
    steps:
      - name: log trigger
        if: github.event_name == 'repository_dispatch'
        run: echo "triggered by ${{ github.event.client_payload.repo }}@${{ github.event.client_payload.sha }}"

      - uses: actions/checkout@v7
        with:
          path: mira-firmware
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/MacThing
          ref: ${{ github.event.inputs.ui_ref || 'main' }}
          path: MacThing

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MacThing/package-lock.json
      - name: build ui
        working-directory: MacThing
        run: |
          npm ci
          npm run build:ui
          cd dist/ui && zip -r9 ../../../mira-firmware/ui.zip .

      - name: empty placeholders for the Docker context
        working-directory: mira-firmware
        run: |
          : > lp.env
          mkdir -p voice-artifacts

      - name: register qemu binfmt
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      - name: docker build
        working-directory: mira-firmware
        run: docker build -t firmware-builder .
      - name: build image
        working-directory: mira-firmware
        run: docker run --rm --privileged -e BUNDLE_VOICE -v "$PWD/output:/work/output" firmware-builder

      - name: checksum
        working-directory: mira-firmware
        run: sha256sum output/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: mira-firmware-image
          path: mira-firmware/output/*.zip
          retention-days: 14
          if-no-files-found: error

      - name: publish release
        working-directory: mira-firmware
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="image-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          notes="$(printf 'Built from `%s`.\n\n```\n%s\n```\n' "$GITHUB_SHA" "$(sha256sum output/*.zip)")"
          gh release create "$tag" output/*.zip \
            --title "Car Thing image ${GITHUB_RUN_NUMBER}" \
            --notes "$notes" \
            --target "$GITHUB_SHA"
